# ==============================================================================
# LOGITRACK - CONFIG SERVER
# Microservicio de Configuración Centralizada (Sprint 2 - DAAS)
# ==============================================================================

server:
  port: ${PORT:${SERVER_PORT:8085}}

spring:
  application:
    name: configserver
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: ${GIT_CONFIG_URI:https://github.com/logitrack-lazyhawk/configserver-ms.git}
          default-label: ${GIT_DEFAULT_LABEL:main}
          clone-on-start: true
          force-pull: true
          timeout: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
