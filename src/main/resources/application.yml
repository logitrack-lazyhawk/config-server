server:
  port: 8085

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/logitrack-lazyhawk/logitrack-config.git}
          default-label: ${CONFIG_REPO_BRANCH:main}
          clone-on-start: ${CONFIG_REPO_CLONE_ON_START:false}
          force-pull: true
          timeout: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
